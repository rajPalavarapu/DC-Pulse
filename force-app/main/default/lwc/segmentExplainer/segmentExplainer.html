<template>
    <lightning-card>

        <!-- Health Summary Loading -->
        <template lwc:if={isLoadingHealth}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <div class="slds-p-around_medium">
            <lightning-tabset>

                <!-- ── TAB 1: SEGMENT ANALYZER ── -->
                <lightning-tab label="Segment Analyzer" value="segment">

                    <!-- Segment Health Dashboard -->
                    <template lwc:if={hasHealthSummary}>
                        <div class="slds-box sa-section">
                            <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_small">
                                <div class="slds-col">
                                    <p class="slds-text-title_caps">Segment Health Overview</p>
                                    <p class="slds-text-color_weak slds-text-body_small">{totalSegmentCount} segments in this org (based on first 500)</p>
                                </div>
                            </div>
                            <div class="slds-grid slds-gutters">

                                <div class="slds-col slds-size_1-of-3">
                                    <button class="health-tile slds-box slds-text-align_center" data-category="zero" onclick={handleTileClick}>
                                        <lightning-icon icon-name="utility:error" size="small" variant="error" class="slds-m-bottom_x-small"></lightning-icon>
                                        <p class="slds-text-heading_medium">{zeroPopulationCount}</p>
                                        <p class="slds-text-title_caps slds-m-bottom_x-small">Zero Population</p>
                                        <template lwc:if={hasZeroPopulation}>
                                            <p class="slds-text-body_small slds-text-color_weak">Click to view list</p>
                                        </template>
                                        <template lwc:else>
                                            <p class="slds-text-body_small slds-text-color_weak">None — all segments have members</p>
                                        </template>
                                    </button>
                                </div>

                                <div class="slds-col slds-size_1-of-3">
                                    <button class="health-tile slds-box slds-text-align_center" data-category="inactive" onclick={handleTileClick}>
                                        <lightning-icon icon-name="utility:ban" size="small" variant="warning" class="slds-m-bottom_x-small"></lightning-icon>
                                        <p class="slds-text-heading_medium">{inactiveCount}</p>
                                        <p class="slds-text-title_caps slds-m-bottom_x-small">Inactive</p>
                                        <template lwc:if={hasInactive}>
                                            <p class="slds-text-body_small slds-text-color_weak">Click to view list</p>
                                        </template>
                                        <template lwc:else>
                                            <p class="slds-text-body_small slds-text-color_weak">None — all segments are active</p>
                                        </template>
                                    </button>
                                </div>

                                <div class="slds-col slds-size_1-of-3">
                                    <button class="health-tile slds-box slds-text-align_center" data-category="manual" onclick={handleTileClick}>
                                        <lightning-icon icon-name="utility:clock" size="small" variant="warning" class="slds-m-bottom_x-small"></lightning-icon>
                                        <p class="slds-text-heading_medium">{manualRefreshCount}</p>
                                        <p class="slds-text-title_caps slds-m-bottom_x-small">No Auto-Refresh</p>
                                        <template lwc:if={hasManualRefresh}>
                                            <p class="slds-text-body_small slds-text-color_weak">Click to view list</p>
                                        </template>
                                        <template lwc:else>
                                            <p class="slds-text-body_small slds-text-color_weak">None — all segments have a schedule</p>
                                        </template>
                                    </button>
                                </div>

                            </div>
                        </div>
                    </template>

                    <!-- Segment Inspector -->
                    <div class="slds-box sa-section">
                        <div class="slds-m-bottom_small">
                            <p class="slds-text-title_caps">Segment Inspector</p>
                            <p class="slds-text-color_weak slds-text-body_small">Search for a segment to inspect its population, refresh health, criteria, and activation readiness.</p>
                        </div>
                    <div class="segment-search-container">
                        <div class="slds-form-element">
                            <label class="slds-form-element__label">Search Segment</label>
                            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left-right">
                                <lightning-icon icon-name="utility:search" size="x-small" class="slds-icon slds-input__icon slds-input__icon_left"></lightning-icon>
                                <input
                                    type="text"
                                    class="slds-input"
                                    placeholder="Type at least 3 characters to search segments..."
                                    value={searchTerm}
                                    oninput={handleSearchInput} />
                                <template lwc:if={isSearching}>
                                    <lightning-spinner size="x-small" alternative-text="Searching" class="slds-icon slds-input__icon slds-input__icon_right"></lightning-spinner>
                                </template>
                                <template lwc:if={hasSelectedSegment}>
                                    <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right" onclick={handleSearchClear} title="Clear">
                                        <lightning-icon icon-name="utility:clear" size="x-small"></lightning-icon>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- Search Results Dropdown -->
                        <template lwc:if={hasSearchResults}>
                            <div class="segment-search-results slds-box slds-p-around_none">
                                <template for:each={searchResults} for:item="result">
                                    <div key={result.apiName}
                                         class="segment-result-item slds-p-around_small"
                                         data-api-name={result.apiName}
                                         data-display-name={result.displayName}
                                         onclick={handleSelectSearchResult}>
                                        <p class="slds-text-body_regular slds-m-bottom_xx-small"><strong>{result.displayName}</strong></p>
                                        <p class="slds-text-body_small slds-text-color_weak">{result.segmentStatus} &nbsp;·&nbsp; {result.lastSegmentMemberCount} members</p>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- No Results -->
                        <template lwc:if={noSearchResults}>
                            <div class="slds-box slds-m-top_x-small">
                                <p class="slds-text-body_small slds-text-color_weak slds-p-around_x-small">No segments found matching &quot;{searchTerm}&quot;</p>
                            </div>
                        </template>
                    </div>

                    <!-- Segment Detail Loading -->
                    <template lwc:if={isLoading}>
                        <div class="slds-align_absolute-center slds-p-around_medium">
                            <lightning-spinner alternative-text="Loading segment details" size="small"></lightning-spinner>
                        </div>
                    </template>

                    <!-- Segment Details Panel -->
                    <template lwc:if={selectedSegmentData}>
                        <div class="slds-m-top_small">

                            <!-- Segment Overview Card -->
                            <div class="seg-card slds-m-bottom_medium">

                                <!-- Hero row: population + status badge + divider + secondary fields -->
                                <div class="seg-hero-row">
                                    <div class="seg-hero-stat">
                                        <span class="seg-hero-number">{selectedSegmentData.lastSegmentMemberCount}</span>
                                        <span class="seg-field-label">Total Profiles</span>
                                    </div>

                                    <div class="seg-hero-divider"></div>

                                    <div class="seg-hero-stat seg-hero-stat_badge">
                                        <span class={statusBadgeClass}>{selectedSegmentData.segmentStatus}</span>
                                        <span class="seg-field-label">Status</span>
                                    </div>

                                    <div class="seg-hero-stat">
                                        <span class={refreshStatusClass}>{refreshStatusLabel}</span>
                                        <span class="seg-field-label">Last Refreshed</span>
                                    </div>

                                    <div class="seg-hero-stat">
                                        <span class="seg-field-value">{publishIntervalFormatted}</span>
                                        <span class="seg-field-label">Refresh Schedule</span>
                                    </div>
                                </div>

                                <!-- Metadata strip -->
                                <div class="seg-meta-strip">
                                    <div class="seg-meta-field">
                                        <span class="seg-field-label">API Name</span>
                                        <span class="seg-meta-value">{selectedSegmentData.apiName}</span>
                                    </div>
                                    <div class="seg-meta-sep"></div>
                                    <div class="seg-meta-field">
                                        <span class="seg-field-label">Built On</span>
                                        <span class="seg-meta-value">{builtOnLabel}</span>
                                    </div>
                                    <div class="seg-meta-sep"></div>
                                    <div class="seg-meta-field">
                                        <span class="seg-field-label">Last Modified</span>
                                        <span class="seg-meta-value">{lastModifiedFormatted}</span>
                                    </div>
                                    <template lwc:if={parsedCriteria}>
                                        <div class="seg-meta-sep"></div>
                                        <div class="seg-meta-field seg-meta-field_grow">
                                            <span class="seg-field-label">
                                                Criteria
                                                <span class="seg-filter-pill">{filterCountLabel}</span>
                                            </span>
                                            <span class="seg-criteria-chip">{parsedCriteria}</span>
                                        </div>
                                    </template>
                                </div>

                                <!-- Alerts — only shown when needed -->
                                <template lwc:if={isStale}>
                                    <div class="seg-alert seg-alert_warning">
                                        <lightning-icon icon-name="utility:clock" size="x-small" class="seg-alert-icon"></lightning-icon>
                                        <span><strong>Stale Data —</strong> Not refreshed in {daysSinceRefresh} days. Population counts may not reflect current data.</span>
                                    </div>
                                </template>
                                <template lwc:if={showDmoWarning}>
                                    <div class="seg-alert seg-alert_warning">
                                        <lightning-icon icon-name="utility:warning" size="x-small" class="seg-alert-icon"></lightning-icon>
                                        <span><strong>Activation Warning —</strong> Built on Individual DMO, not Unified Individual. Activating may send duplicate profiles to the destination.</span>
                                    </div>
                                </template>
                                <template lwc:if={filterLimitCritical}>
                                    <div class="seg-alert seg-alert_error">
                                        <lightning-icon icon-name="utility:error" size="x-small" class="seg-alert-icon"></lightning-icon>
                                        <span><strong>Filter Limit Critical —</strong> At the 50-filter limit. Adding more filters will cause segment errors.</span>
                                    </div>
                                </template>
                                <template lwc:elseif={filterLimitWarning}>
                                    <div class="seg-alert seg-alert_warning">
                                        <lightning-icon icon-name="utility:warning" size="x-small" class="seg-alert-icon"></lightning-icon>
                                        <span><strong>Filter Limit Warning —</strong> Approaching the 50-filter limit. Consider consolidating unused criteria groups.</span>
                                    </div>
                                </template>

                            </div>

                            <!-- Activation Readiness Panel -->
                            <div class="slds-box slds-m-bottom_medium">
                                <p class="slds-text-title_caps slds-m-bottom_x-small">Activation Readiness</p>
                                <p class="slds-text-color_weak slds-text-body_small slds-m-bottom_medium">Based on latest published snapshot. Shows how many profiles will reach the destination per channel.</p>

                                <template lwc:if={isIndividualBased}>

                                <template lwc:if={isLoadingReadiness}>
                                    <div class="slds-align_absolute-center slds-p-around_medium">
                                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                    </div>
                                </template>

                                <template lwc:if={activationReadiness}>
                                    <div class="ar-tiles slds-m-bottom_medium">

                                        <div class="ar-tile ar-tile_neutral">
                                            <p class="ar-tile-label">Publishable Reach</p>
                                            <p class="ar-tile-number">{activationReadiness.total}</p>
                                            <p class="ar-tile-sub">Profiles in published snapshot</p>
                                        </div>

                                        <div class={emailTileClass}>
                                            <p class="ar-tile-label">Email Reachable</p>
                                            <p class="ar-tile-number">{emailCoveragePercent}%</p>
                                            <p class="ar-tile-sub">{activationReadiness.email} profiles</p>
                                        </div>

                                        <div class={phoneTileClass}>
                                            <p class="ar-tile-label">Phone Reachable</p>
                                            <p class="ar-tile-number">{phoneCoveragePercent}%</p>
                                            <p class="ar-tile-sub">{activationReadiness.phone} profiles</p>
                                        </div>

                                    </div>

                                    <!-- Missing Email -->
                                    <template lwc:if={emailDropWarning}>
                                        <div class="drop-alert slds-m-bottom_x-small">
                                            <lightning-icon icon-name="utility:warning" size="x-small" class="drop-alert-icon"></lightning-icon>
                                            <span><strong>{emailDropCount} profiles will be dropped on email activation</strong> — no email contact point.</span>
                                            <lightning-button
                                                label={missingEmailButtonLabel}
                                                variant="base"
                                                class="slds-m-left_small"
                                                onclick={handleViewMissingEmail}>
                                            </lightning-button>
                                        </div>
                                        <template lwc:if={showMissingEmail}>
                                            <div class="slds-box slds-m-bottom_x-small">
                                                <template lwc:if={isLoadingMissingEmail}>
                                                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                                </template>
                                                <template lwc:if={missingEmailProfiles}>
                                                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">Showing first 10 profiles missing email. For full list use the query below.</p>
                                                    <lightning-datatable
                                                        key-field="unifiedId"
                                                        data={missingEmailProfiles}
                                                        columns={missingEmailColumns}
                                                        hide-checkbox-column>
                                                    </lightning-datatable>
                                                    <div class="slds-box slds-theme_shade slds-m-top_small">
                                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                            <p class="slds-text-title_caps">Run in Data Cloud Query Editor for full list:</p>
                                                            <button class="slds-button slds-button_icon slds-button_icon-border-filled" title="Copy query" data-query={missingEmailSql} onclick={handleCopyQuery}>
                                                                <lightning-icon icon-name="utility:copy" size="x-small"></lightning-icon>
                                                            </button>
                                                        </div>
                                                        <pre style="white-space: pre-wrap; font-size: 11px;">{missingEmailSql}</pre>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </template>

                                    <!-- Missing Phone -->
                                    <template lwc:if={phoneDropWarning}>
                                        <div class="drop-alert slds-m-bottom_x-small">
                                            <lightning-icon icon-name="utility:warning" size="x-small" class="drop-alert-icon"></lightning-icon>
                                            <span><strong>{phoneDropCount} profiles will be dropped on phone/SMS activation</strong> — no phone contact point.</span>
                                            <lightning-button
                                                label={missingPhoneButtonLabel}
                                                variant="base"
                                                class="slds-m-left_small"
                                                onclick={handleViewMissingPhone}>
                                            </lightning-button>
                                        </div>
                                        <template lwc:if={showMissingPhone}>
                                            <div class="slds-box slds-m-bottom_x-small">
                                                <template lwc:if={isLoadingMissingPhone}>
                                                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                                </template>
                                                <template lwc:if={missingPhoneProfiles}>
                                                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">Showing first 10 profiles missing phone. For full list use the query below.</p>
                                                    <lightning-datatable
                                                        key-field="unifiedId"
                                                        data={missingPhoneProfiles}
                                                        columns={missingPhoneColumns}
                                                        hide-checkbox-column>
                                                    </lightning-datatable>
                                                    <div class="slds-box slds-theme_shade slds-m-top_small">
                                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                                                            <p class="slds-text-title_caps">Run in Data Cloud Query Editor for full list:</p>
                                                            <button class="slds-button slds-button_icon slds-button_icon-border-filled" title="Copy query" data-query={missingPhoneSql} onclick={handleCopyQuery}>
                                                                <lightning-icon icon-name="utility:copy" size="x-small"></lightning-icon>
                                                            </button>
                                                        </div>
                                                        <pre style="white-space: pre-wrap; font-size: 11px;">{missingPhoneSql}</pre>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </template>

                                </template>

                                <template lwc:if={noMembershipTable}>
                                    <p class="slds-text-color_weak">Segment has not been published. Publish the segment to view activation readiness metrics.</p>
                                </template>

                                </template>
                                <template lwc:else>
                                    <div class="slds-notify slds-notify_alert slds-theme_info" role="alert">
                                        <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        <strong>Not available for {unsupportedDmoLabel} segments.</strong> Activation readiness metrics currently support Individual and Unified Individual segments only.
                                    </div>
                                </template>

                            </div>

                        </div>
                    </template>

                    <!-- Error -->
                    <template lwc:if={errorMessage}>
                        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium" role="alert">
                            <span>{errorMessage}</span>
                        </div>
                    </template>

                    </div><!-- close Segment Inspector box -->

                    <!-- Segment Overlap — always visible, independent of selected segment -->
                    <div class="slds-box sa-section">
                        <c-segment-overlap></c-segment-overlap>
                    </div>

                </lightning-tab>

                <!-- ── TAB 2: IR HEALTH ── -->
                <lightning-tab label="IR Health" value="ir">
                    <c-ir-health></c-ir-health>
                </lightning-tab>

                <!-- ── TAB 3: ADOPTABILITY (hidden — scoring not aligned with project direction; revisit in future release) ── -->
                <!--
                <lightning-tab label="Adoptability" value="adoptability">
                    <c-adoptability></c-adoptability>
                </lightning-tab>
                -->

                <!-- ── TAB 4: DATA STREAMS HEALTH (future) ── -->
                <lightning-tab label="Data Streams" value="datastreams">
                    <div class="cs-container">
                        <div class="cs-header">
                            <lightning-icon icon-name="standard:data_streams" size="large"></lightning-icon>
                            <div class="cs-title-block">
                                <h2 class="slds-text-heading_large">Data Streams Health</h2>
                                <span class="cs-badge">Coming Soon</span>
                            </div>
                        </div>
                        <p class="cs-desc">Monitor active vs inactive streams, last run times, ingestion record counts, and flag stale streams that haven&apos;t run recently.</p>
                        <div class="cs-grid">
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:check" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Stream Status</h3>
                                <p class="cs-card-body">Active vs inactive status for every data stream at a glance.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:clock" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Last Run Times</h3>
                                <p class="cs-card-body">See when each stream last ingested data and flag overdue ones.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:database" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Ingestion Counts</h3>
                                <p class="cs-card-body">Record counts per stream per run to spot drops or spikes early.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:warning" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Stale Stream Alerts</h3>
                                <p class="cs-card-body">Automatic flags for streams that have not run within expected windows.</p>
                            </div>
                        </div>
                    </div>
                </lightning-tab>

                <!-- ── TAB 5: CALCULATED INSIGHTS MONITOR (future) ── -->
                <lightning-tab label="Calculated Insights" value="calculatedinsights">
                    <div class="cs-container">
                        <div class="cs-header">
                            <lightning-icon icon-name="standard:metrics" size="large"></lightning-icon>
                            <div class="cs-title-block">
                                <h2 class="slds-text-heading_large">Calculated Insights Monitor</h2>
                                <span class="cs-badge">Coming Soon</span>
                            </div>
                        </div>
                        <p class="cs-desc">Track CI status, last refresh time, schedule health, and flag insights with no data or overdue refreshes.</p>
                        <div class="cs-grid">
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:metrics" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">CI Status Overview</h3>
                                <p class="cs-card-body">See which calculated insights are active, paused, or erroring.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:refresh" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Refresh Schedule Health</h3>
                                <p class="cs-card-body">Monitor scheduled refresh cadence and flag missed or delayed runs.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:error" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">No-Data Alerts</h3>
                                <p class="cs-card-body">Surface insights returning zero rows so you can investigate quickly.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:trending" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Output Trends</h3>
                                <p class="cs-card-body">Track row counts over time to detect unexpected drops or growth.</p>
                            </div>
                        </div>
                    </div>
                </lightning-tab>

                <!-- ── TAB 6: ACTIVATION HEALTH (future) ── -->
                <lightning-tab label="Activation Health" value="activationhealth">
                    <div class="cs-container">
                        <div class="cs-header">
                            <lightning-icon icon-name="standard:channel_programs" size="large"></lightning-icon>
                            <div class="cs-title-block">
                                <h2 class="slds-text-heading_large">Activation Health</h2>
                                <span class="cs-badge">Coming Soon</span>
                            </div>
                        </div>
                        <p class="cs-desc">View activation publish status, last publish time, record counts, and surface activations with errors or zero records.</p>
                        <div class="cs-grid">
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:upload" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Publish Status</h3>
                                <p class="cs-card-body">Live status for every activation — succeeded, failed, or in progress.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:clock" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Last Publish Times</h3>
                                <p class="cs-card-body">See when each activation last ran and flag ones overdue for refresh.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:people" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Record Counts</h3>
                                <p class="cs-card-body">Profiles published per activation run to spot zero-record failures.</p>
                            </div>
                            <div class="cs-card">
                                <lightning-icon icon-name="utility:error" size="small" class="cs-card-icon"></lightning-icon>
                                <h3 class="cs-card-title">Error Surfacing</h3>
                                <p class="cs-card-body">Highlight activations with errors or zero records needing attention.</p>
                            </div>
                        </div>
                    </div>
                </lightning-tab>

            </lightning-tabset>
        </div>
    </lightning-card>

    <!-- Segment Health Modal -->
    <template lwc:if={modalOpen}>
        <div class="custom-modal-overlay" onclick={handleModalClose}>
            <div class="custom-modal-dialog" onclick={handleModalDialogClick}>
                <div class="custom-modal-header">
                    <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                    <button class="slds-button slds-button_icon" onclick={handleModalClose} title="Close">
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                </div>
                <div class="custom-modal-body">
                    <template lwc:if={isLoadingModal}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                        </div>
                    </template>
                    <template lwc:else>
                        <lightning-input
                            type="search"
                            label="Filter segments"
                            placeholder="Type to filter..."
                            value={modalSearchTerm}
                            onchange={handleModalSearchInput}
                            class="slds-m-bottom_small">
                        </lightning-input>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">{modalPageInfo}</p>
                        <lightning-datatable
                            key-field="apiName"
                            data={modalPagedRows}
                            columns={modalColumns}
                            hide-checkbox-column>
                        </lightning-datatable>
                        <div class="slds-grid slds-grid_align-center slds-m-top_small">
                            <lightning-button
                                label="Previous"
                                icon-name="utility:chevronleft"
                                disabled={modalDisabledPrev}
                                onclick={handleModalPrev}
                                class="slds-m-right_x-small">
                            </lightning-button>
                            <lightning-button
                                label="Next"
                                icon-name="utility:chevronright"
                                icon-position="right"
                                disabled={modalDisabledNext}
                                onclick={handleModalNext}>
                            </lightning-button>
                        </div>
                    </template>
                </div>
                <div class="custom-modal-footer">
                    <lightning-button label="Close" variant="brand" onclick={handleModalClose}></lightning-button>
                </div>
            </div>
        </div>
    </template>
</template>
